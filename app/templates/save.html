<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>GTA-VI — Save {{ basename }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  <body>
    <main class="container">
      <h1>Save: {{ basename }}</h1>
      <p>Seed: {{ record.seed }} — Health: {{ record.health }} — IGT: {{ "%.2f"|format(record.igt) }} — Success: {{ record.success }}</p>
      <p><a href="/download/{{ basename }}">Download JSON</a> • <a href="/">Back</a></p>

      <h2>Preview</h2>
      <canvas id="preview" width="360" height="640" style="border:1px solid #333"></canvas>

      <script id="save-data" type="application/json">{{ record | tojson }}</script>
      <script src="/static/js/preview.js"></script>
    </main>
  </body>
</html>
